name: wce
services:
  web:
    build: .
    image: wce-web:local
    restart: unless-stopped
    environment:
      WCE_GITHUB_URL: ${WCE_GITHUB_URL:-https://github.com/wce-research}
      PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:-}
      PUBLIC_WCE_REPO_ENABLED: ${PUBLIC_WCE_REPO_ENABLED:-true}
      WCE_X_URL: ${WCE_X_URL:-}
      WCE_LINKEDIN_URL: ${WCE_LINKEDIN_URL:-https://www.linkedin.com/company/wce-labs/}
      WCE_INSTAGRAM_URL: ${WCE_INSTAGRAM_URL:-}
    ports:
      - "127.0.0.1:${WCE_HOST_PORT:-3018}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 20s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app

networks:
  app: {}
